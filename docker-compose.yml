services:
  db:
    image: postgres:16-alpine
    container_name: quixada-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quixada
      POSTGRES_USER: quixada
      POSTGRES_PASSWORD: quixada
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quixada -d quixada"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quixada-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://quixada:quixada@db:5432/quixada
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  db_data:
